<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Scrivi un articolo | InsideOutHabbo</title>

  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .contenitore {
      max-width: 850px;
      margin: 30px auto;
      padding: 30px;
      background: #19263a;
      border: 1px solid #30415b;
      border-radius: 12px;
    }

    h1 {
      color: #ffd43b;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #40516c;
      border-radius: 6px;
      background: #101827;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .descrizione {
      color: #b8c4d6;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="contenitore">

    <h1>Scrivi un articolo</h1>

    <p class="descrizione">
      Prepara il tuo articolo per la pubblicazione su InsideOutHabbo.
    </p>

    <form id="formArticolo">

      <label for="titolo">Titolo dell'articolo</label>
      <input type="text" id="titolo" placeholder="Inserisci il titolo">

      <label for="categoria">Categoria</label>
      <select id="categoria">
        <option value="">Seleziona una categoria</option>
        <option value="Attualità">Attualità</option>
        <option value="Habbo">Habbo</option>
        <option value="Roleplay">Roleplay</option>
        <option value="Community">Community</option>
        <option value="Eventi">Eventi</option>
      </select>

      <label for="copertina">Immagine di copertina</label>
<input type="file" id="copertina" accept="image/*">
<img id="anteprimaCopertina" src="" alt="Anteprima copertina" style="display:none; max-width:300px; margin-top:10px;">

      <label for="estratto">Breve descrizione</label>
      <textarea id="estratto" placeholder="Presenta brevemente l'articolo..." style="min-height:100px"></textarea>

      <label for="contenuto">Contenuto dell'articolo</label>
      <textarea id="contenuto" placeholder="Scrivi qui il tuo articolo..."></textarea>

       <div style="display:flex; gap:12px; margin-top:25px; flex-wrap:wrap;">
        <button type="button" id="salvaBozza"
          style="padding:13px 20px; background:#40516c; color:white; border:0; border-radius:6px; cursor:pointer;">
          Salva bozza
        </button>

        <button type="button" id="pubblicaArticolo"
          style="padding:13px 20px; background:#ffd43b; color:#101827; border:0; border-radius:6px; font-weight:bold; cursor:pointer;">
          Pubblica articolo
        </button>
      </div>

      <p id="messaggio" class="descrizione"></p>
    </form>

  </div>

  <script>
  const SUPABASE_URL = "https://mlgxlsstmaoxhigtqdhb.supabase.co";

  const SUPABASE_KEY = "sb_publishable_sTxl1t86vPFICBUzKg4tpw_XWxRI8Mj";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function verificaAccesso() {
    const { data: sessione } = await client.auth.getSession();

    if (!sessione.session) {
      window.location.href = "accesso.html";
      return;
    }

    const user = sessione.session.user;

    const { data: profilo, error } = await client
      .from("profiles")
      .select("habbo_name, display_name, role")
      .eq("id", user.id)
      .maybeSingle();

    if (error || !profilo) {
      document.body.innerHTML = "<h2>Impossibile caricare il profilo.</h2>";
      return;
    }

    const ruoliAutorizzati = ["redattore", "caporedattore", "admin"];

    if (!ruoliAutorizzati.includes(profilo.role)) {
      document.body.innerHTML = "<h2>Non hai i permessi per scrivere articoli.</h2>";
      return;
    }

    document.getElementById("titolo").dataset.autore =
      profilo.display_name || profilo.habbo_name || user.email;
  }

      document.getElementById("copertina").addEventListener("change", function() {
    const file = this.files[0];

    if (!file) return;

    const anteprima = document.getElementById("anteprimaCopertina");
    anteprima.src = URL.createObjectURL(file);
    anteprima.style.display = "block";
  });

  verificaAccesso();
</script>
</body>
</html>
  verificaAccesso();
</script>
</body>
</html>
