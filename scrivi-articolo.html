<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Scrivi un articolo | InsideOutHabbo</title>

  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .contenitore {
      max-width: 850px;
      margin: 30px auto;
      padding: 30px;
      background: #19263a;
      border: 1px solid #30415b;
      border-radius: 12px;
    }

    h1 {
      color: #ffd43b;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #40516c;
      border-radius: 6px;
      background: #101827;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .descrizione {
      color: #b8c4d6;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="contenitore">

    <h1>Scrivi un articolo</h1>

    <p class="descrizione">
      Prepara il tuo articolo per la pubblicazione su InsideOutHabbo.
    </p>

    <form id="formArticolo">

      <label for="titolo">Titolo dell'articolo</label>
      <input type="text" id="titolo" placeholder="Inserisci il titolo">

      <label for="categoria">Categoria</label>
      <select id="categoria">
        <option value="">Seleziona una categoria</option>
        <option value="Attualità">Attualità</option>
        <option value="Habbo">Habbo</option>
        <option value="Roleplay">Roleplay</option>
        <option value="Community">Community</option>
        <option value="Eventi">Eventi</option>
      </select>

      <label for="copertina">Immagine di copertina</label>
<input type="file" id="copertina" accept="image/*">
<img id="anteprimaCopertina" src="" alt="Anteprima copertina" style="display:none; max-width:300px; margin-top:10px;">

      <label for="estratto">Breve descrizione</label>
      <textarea id="estratto" placeholder="Presenta brevemente l'articolo..." style="min-height:100px"></textarea>

      <label for="contenuto">Contenuto dell'articolo</label>
      <textarea id="contenuto" placeholder="Scrivi qui il tuo articolo..."></textarea>

       <div style="display:flex; gap:12px; margin-top:25px; flex-wrap:wrap;">
        <button type="button" id="salvaBozza"
          style="padding:13px 20px; background:#40516c; color:white; border:0; border-radius:6px; cursor:pointer;">
          Salva bozza
        </button>

        <button type="button" id="pubblicaArticolo"
          style="padding:13px 20px; background:#ffd43b; color:#101827; border:0; border-radius:6px; font-weight:bold; cursor:pointer;">
          Pubblica articolo
        </button>
      </div>

      <p id="messaggio" class="descrizione"></p>
    </form>

  </div>

 
<script>
  const SUPABASE_URL = "https://mlgxlsstmaoxhigtqdhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sTxl1t86vPFICBUzKg4tpw_XWxRI8Mj";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let utente = null;
  let profiloUtente = null;
  let articoloInModifica = null;

  const messaggio = document.getElementById("messaggio");
  const pulsanteBozza = document.getElementById("salvaBozza");
  const pulsantePubblica = document.getElementById("pubblicaArticolo");

  function mostraMessaggio(testo) {
    messaggio.textContent = testo;
  }

  const parametri = new URLSearchParams(window.location.search);
const idArticolo = parametri.get("id");

async function caricaArticoloDaModificare() {
  if (!idArticolo) return;

  mostraMessaggio("Caricamento articolo...");

  const { data, error } = await client
    .from("articles")
    .select("*")
    .eq("id", idArticolo)
    .maybeSingle();

  if (error || !data) {
    mostraMessaggio("Impossibile caricare l'articolo.");
    return;
  }

  articoloInModifica = data;

  document.getElementById("titolo").value = data.title || "";
  document.getElementById("categoria").value = data.category || "";
  document.getElementById("estratto").value = data.excerpt || "";
  document.getElementById("contenuto").value = data.content || "";

  if (data.cover_image_url) {
    const anteprima = document.getElementById("anteprimaCopertina");
    anteprima.src = data.cover_image_url;
    anteprima.style.display = "block";
  }

  mostraMessaggio("Stai modificando: " + data.title);
}
  async function verificaAccesso() {
    const { data, error } = await client.auth.getSession();

    if (error || !data.session) {
      window.location.href = "accesso.html";
      return false;
    }

    utente = data.session.user;

    const { data: profilo, error: erroreProfilo } = await client
      .from("profiles")
      .select("habbo_name, display_name, role")
      .eq("id", utente.id)
      .maybeSingle();

    if (erroreProfilo || !profilo) {
      mostraMessaggio("Impossibile caricare il profilo.");
      return false;
    }

    const ruoli = ["redattore", "caporedattore", "admin"];

    if (!ruoli.includes(profilo.role)) {
      mostraMessaggio("Non hai i permessi per scrivere articoli.");
      return false;
    }

    profiloUtente = profilo;

await caricaArticoloDaModificare();

return true;;
  }

  document.getElementById("copertina").addEventListener("change", function () {
    const file = this.files[0];
    const anteprima = document.getElementById("anteprimaCopertina");

    if (!file) {
      anteprima.style.display = "none";
      return;
    }

    if (!file.type.startsWith("image/")) {
      mostraMessaggio("Seleziona un file immagine valido.");
      this.value = "";
      return;
    }

    anteprima.src = URL.createObjectURL(file);
    anteprima.style.display = "block";
  });

 
async function salvaArticolo(stato) {
  pulsanteBozza.disabled = true;
  pulsantePubblica.disabled = true;
  mostraMessaggio("Salvataggio in corso...");

  try {
    if (!utente || !profiloUtente) {
      throw new Error("Accesso non verificato.");
    }

    const titolo = document.getElementById("titolo").value.trim();
    const categoria = document.getElementById("categoria").value;
    const estratto = document.getElementById("estratto").value.trim();
    const contenuto = document.getElementById("contenuto").value.trim();
    const file = document.getElementById("copertina").files[0];

    if (!titolo || !categoria || !contenuto) {
      throw new Error("Compila titolo, categoria e contenuto.");
    }

    let copertinaUrl = articoloInModifica?.cover_image_url || null;

    if (file) {
      if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
        throw new Error("Immagine non valida o superiore a 5 MB.");
      }

      const nomePulito = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const percorso = utente.id + "/" + crypto.randomUUID() + "-" + nomePulito;

      const { error } = await client.storage
        .from("copertine")
        .upload(percorso, file);

      if (error) throw error;

      const { data } = client.storage
        .from("copertine")
        .getPublicUrl(percorso);

      copertinaUrl = data.publicUrl;
    }

    const articolo = {
      title: titolo,
      category: categoria,
      excerpt: estratto,
      content: contenuto,
      cover_image_url: copertinaUrl,
      status: stato,
      published_at: stato === "published"
        ? (articoloInModifica?.published_at || new Date().toISOString())
        : null
    };

    let erroreSalvataggio;

    if (articoloInModifica) {
      const risultato = await client
        .from("articles")
        .update(articolo)
        .eq("id", articoloInModifica.id);

      erroreSalvataggio = risultato.error;
    } else {
      const risultato = await client
        .from("articles")
        .insert({
          ...articolo,
          author_id: utente.id
        });

      erroreSalvataggio = risultato.error;
    }

    if (erroreSalvataggio) throw erroreSalvataggio;

    mostraMessaggio(
      articoloInModifica
        ? "Articolo aggiornato correttamente!"
        : stato === "published"
          ? "Articolo pubblicato correttamente!"
          : "Bozza salvata correttamente!"
    );

    if (articoloInModifica) {
      articoloInModifica = {
        ...articoloInModifica,
        ...articolo
      };
    } else {
      document.getElementById("formArticolo").reset();
      document.getElementById("anteprimaCopertina").style.display = "none";
    }

  } catch (errore) {
    console.error(errore);
    mostraMessaggio("Errore: " + (errore.message || "salvataggio non riuscito."));
  } finally {
    pulsanteBozza.disabled = false;
    pulsantePubblica.disabled = false;
  }
}

  pulsanteBozza.addEventListener("click", function () {
    salvaArticolo("draft");
  });

  pulsantePubblica.addEventListener("click", function () {
    salvaArticolo("published");
  });

  verificaAccesso();
</script>

</body>
</html>
