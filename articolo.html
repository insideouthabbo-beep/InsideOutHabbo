<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articolo | InsideOutHabbo</title>
  <style>
    :root {
      --navy: #101b35;
      --blue: #1d3158;
      --yellow: #ffd34e;
      --light: #f3f5f9;
      --text: #202b40;
      --muted: #778198;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span { color: var(--yellow); }

    .tagline {
      color: #c4cde0;
      font-size: 12px;
      margin-top: 5px;
    }

    .home-link {
      background: var(--yellow);
      color: var(--navy);
      padding: 11px 18px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    nav {
      background: var(--blue);
      padding: 15px 7%;
      color: white;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    main {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .article {
      background: white;
      border-radius: 9px;
      padding: 35px;
      box-shadow: 0 5px 20px #15213a0d;
    }

    .category {
      color: #a47c12;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--navy);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
      margin: 15px 0;
    }

    .date {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 25px;
    }

    .cover {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: 7px;
      margin-bottom: 25px;
    }

    .content {
      font-size: 17px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .comments {
      margin-top: 45px;
      padding-top: 30px;
      border-top: 2px solid #edf0f5;
    }

    .comments h2 {
      color: var(--navy);
      font-size: 25px;
      margin: 0 0 8px;
    }

    .comments-intro {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .comment-item {
      display: flex;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .comment-avatar {
      width: 48px;
      height: 55px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .comment-author {
      font-weight: bold;
      color: var(--navy);
      font-size: 14px;
    }

    .comment-date {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .comment-content {
      margin-top: 9px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .no-comments {
      color: var(--muted);
      font-size: 14px;
      padding: 15px 0;
    }

    .comment-form {
      margin-top: 25px;
    }

    .comment-form label {
      display: block;
      color: var(--navy);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .comment-form textarea {
      width: 100%;
      min-height: 110px;
      padding: 13px;
      border: 1px solid #dce1eb;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      resize: vertical;
    }

    .comment-form button {
      margin-top: 12px;
      padding: 12px 20px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .comment-form button:hover { background: var(--blue); }
    .comment-form button:disabled { opacity: .6; cursor: wait; }

    .comment-notice {
      margin-top: 15px;
      padding: 12px;
      background: #f3f5f9;
      border-radius: 5px;
      font-size: 13px;
      color: var(--text);
    }

    .comment-login {
      margin-top: 22px;
      padding: 16px;
      background: #f3f5f9;
      border-radius: 6px;
      font-size: 14px;
    }

    .comment-login a {
      color: var(--blue);
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: var(--blue);
      font-weight: bold;
      text-decoration: none;
    }

    .message {
      text-align: center;
      padding: 35px;
      color: var(--muted);
      background: white;
      border-radius: 9px;
    }

    footer {
      margin-top: 60px;
      background: var(--navy);
      color: #c4cde0;
      text-align: center;
      padding: 30px 20px;
      font-size: 12px;
      line-height: 1.8;
    }

    footer strong { color: white; }

    @media (max-width: 600px) {
      .article { padding: 23px; }
      header { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand">INSIDEOUT<span>HABBO</span></div>
    <div class="tagline">Il mondo Habbo raccontato da noi.</div>
  </div>
  <a class="home-link" href="index.html">TORNA ALLA HOME</a>
</header>

<nav>IL GIORNALE DIGITALE DELLA COMMUNITY HABBO</nav>

<main>
  <div id="articolo" class="message">
    Caricamento dell'articolo...
  </div>
</main>

<footer>
  <strong>INSIDEOUTHABBO</strong><br>
  Il mondo Habbo raccontato da noi.<br>
  Una community, tante storie, un solo universo.
</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://mlgxlsstmaoxhigtqdhb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_sTxl1t86vPFICBUzKg4tpw_XWxRI8Mj';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const contenitore = document.getElementById('articolo');

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  function escapeHTML(testo) {
    return String(testo ?? '').replace(/[&<>"']/g, carattere => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[carattere]);
  }

  function avatarHabbo(nickname) {
    const nome = encodeURIComponent(nickname || '');
    return `https://www.habbo.it/habbo-imaging/avatarimage?user=${nome}&direction=2&head_direction=3&gesture=sml&size=m`;
  }

  function dataCommento(data) {
    return new Date(data).toLocaleString('it-IT', {
      dateStyle: 'short',
      timeStyle: 'short'
    });
  }

  async function caricaCommenti() {
    const lista = document.getElementById('commentList');
    if (!lista) return;

    lista.innerHTML = '<div class="no-comments">Caricamento commenti...</div>';

    const { data, error } = await supabase.rpc('get_article_comments', {
      p_article_id: id
    });

    if (error) {
      console.error('Errore caricamento commenti:', error);
      lista.innerHTML = '<div class="no-comments">Non è stato possibile caricare i commenti.</div>';
      return;
    }

    if (!data || data.length === 0) {
      lista.innerHTML = '<div class="no-comments">Non ci sono ancora commenti. Puoi essere il primo!</div>';
      return;
    }

    lista.innerHTML = data.map(commento => `
      <div class="comment-item">
        <img
          class="comment-avatar"
          src="${escapeHTML(avatarHabbo(commento.habbo_name))}"
          alt="Avatar di ${escapeHTML(commento.habbo_name)}"
          loading="lazy"
          onerror="this.style.display='none'"
        >
        <div>
          <div class="comment-author">${escapeHTML(commento.habbo_name || 'Utente Habbo')}</div>
          <div class="comment-date">${escapeHTML(dataCommento(commento.created_at))}</div>
          <div class="comment-content">${escapeHTML(commento.content)}</div>
        </div>
      </div>
    `).join('');
  }

  async function preparaModuloCommenti() {
    const area = document.getElementById('commentFormArea');
    if (!area) return;

    const { data: { session }, error } = await supabase.auth.getSession();

    if (error) {
      console.error('Errore verifica sessione:', error);
    }

    if (!session) {
      area.innerHTML = `
        <div class="comment-login">
          Per partecipare alla discussione devi
          <a href="accesso.html">accedere o registrarti</a>.
        </div>
      `;
      return;
    }

    area.innerHTML = `
      <form class="comment-form" id="commentForm">
        <label for="commentText">Lascia un commento</label>
        <textarea
          id="commentText"
          maxlength="2000"
          placeholder="Scrivi qui il tuo commento..."
          required
        ></textarea>
        <button type="submit" id="commentSubmit">INVIA COMMENTO</button>
        <div id="commentNotice" class="comment-notice" hidden></div>
      </form>
    `;

    const form = document.getElementById('commentForm');
    const textarea = document.getElementById('commentText');
    const button = document.getElementById('commentSubmit');
    const notice = document.getElementById('commentNotice');

    form.addEventListener('submit', async evento => {
      evento.preventDefault();

      const testo = textarea.value.trim();

      if (!testo) {
        notice.hidden = false;
        notice.textContent = 'Scrivi un commento prima di inviarlo.';
        return;
      }

      if (testo.length > 2000) {
        notice.hidden = false;
        notice.textContent = 'Il commento non può superare 2000 caratteri.';
        return;
      }

      button.disabled = true;
      button.textContent = 'INVIO IN CORSO...';
      notice.hidden = true;

      const { data: { user }, error: userError } = await supabase.auth.getUser();

      if (userError || !user) {
        notice.hidden = false;
        notice.textContent = 'La sessione è scaduta. Accedi nuovamente.';
        button.disabled = false;
        button.textContent = 'INVIA COMMENTO';
        return;
      }

      const { error: insertError } = await supabase
        .from('article_comments')
        .insert({
          article_id: id,
          user_id: user.id,
          content: testo,
          status: 'pending'
        });

      button.disabled = false;
      button.textContent = 'INVIA COMMENTO';

      if (insertError) {
        console.error('Errore invio commento:', insertError);
        notice.hidden = false;
        notice.textContent = 'Non è stato possibile inviare il commento. Riprova.';
        return;
      }

      textarea.value = '';
      notice.hidden = false;
      notice.textContent = 'Commento inviato! Sarà visibile dopo l’approvazione della redazione.';
    });
  }

  async function caricaArticolo() {
    if (!id) {
      contenitore.textContent = 'Nessun articolo selezionato.';
      return;
    }

    try {
      const { data, error } = await supabase
        .from('articles')
        .select('title, content, excerpt, category, cover_image_url, published_at')
        .eq('id', id)
        .eq('status', 'published')
        .single();

      if (error) throw error;

      const dataArticolo = data.published_at
        ? new Date(data.published_at).toLocaleDateString('it-IT')
        : '';

      contenitore.className = 'article';

      contenitore.innerHTML = `
        <div class="category">${escapeHTML(data.category || 'Attualità')}</div>
        <h1>${escapeHTML(data.title)}</h1>
        <div class="date">${escapeHTML(dataArticolo)}</div>
        ${data.cover_image_url
          ? `<img class="cover" src="${escapeHTML(data.cover_image_url)}" alt="${escapeHTML(data.title)}">`
          : ''}
        <div class="content">${escapeHTML(data.content)}</div>

        <section class="comments" aria-labelledby="commentsTitle">
          <h2 id="commentsTitle">Commenti</h2>
          <p class="comments-intro">
            Condividi la tua opinione con la community. I commenti vengono pubblicati
            dopo l'approvazione della redazione.
          </p>
          <div id="commentList">
            <div class="no-comments">Caricamento commenti...</div>
          </div>
          <div id="commentFormArea"></div>
        </section>

        <a class="back" href="index.html">← Torna agli articoli</a>
      `;

      await Promise.all([
        caricaCommenti(),
        preparaModuloCommenti()
      ]);

    } catch (errore) {
      console.error(errore);
      contenitore.className = 'message';
      contenitore.textContent = 'Articolo non trovato oppure non disponibile.';
    }
  }

  caricaArticolo();
</script>

</body>
</html>
