<body>

<header>
  <div>

  <a class="home-link" href="index.html">TORNA ALLA HOME</a>
</header>

<nav>IL GIORNALE DIGITALE DELLA COMMUNITY HABBO</nav>

<main>
  <div id="articolo" class="message">
    Caricamento dell'articolo...
  </div>
</main>

<footer>
  <strong>INSIDEOUTHABBO</strong><br>
  Il mondo Habbo raccontato da noi.<br>
  Una community, tante storie, un solo universo.
</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://mlgxlsstmaoxhigtqdhb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_sTxl1t86vPFICBUzKg4tpw_XWxRI8Mj';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const contenitore = document.getElementById('articolo');

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  function escapeHTML(testo) {
    return String(testo ?? '').replace(/[&<>"']/g, carattere => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[carattere]);
  }

  async function caricaArticolo() {
    if (!id) {
      contenitore.textContent = 'Nessun articolo selezionato.';
      return;
    }

    try {
      const { data, error } = await supabase
        .from('articles')
        .select('title, content, excerpt, category, cover_image_url, published_at')
        .eq('id', id)
        .eq('status', 'published')
        .single();

      if (error) throw error;

      const dataArticolo = data.published_at
        ? new Date(data.published_at).toLocaleDateString('it-IT')
        : '';

      contenitore.className = 'article';

      contenitore.innerHTML = `
        <div class="category">${escapeHTML(data.category || 'Attualità')}</div>
        <h1>${escapeHTML(data.title)}</h1>
        <div class="date">${escapeHTML(dataArticolo)}</div>
        ${data.cover_image_url
          ? `<img class="cover" src="${escapeHTML(data.cover_image_url)}" alt="${escapeHTML(data.title)}">`
          : ''}
        <div class="content">${escapeHTML(data.content)}</div>
        <a class="back" href="index.html">← Torna agli articoli</a>
      `;

    } catch (errore) {
      console.error(errore);
      contenitore.className = 'message';
      contenitore.textContent = 'Articolo non trovato oppure non disponibile.';
    }
  }

  caricaArticolo();
</script>

</body>
